<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>Universo KORVA</title>
<meta name="description" content="KORVA — Alto rendimiento en pádel, pickleball y football flag.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--black:#0a0a0a;--white:#fafaf8;--accent:#c8a96e}
html,body{height:100%;overflow:hidden}
body{font-family:'Sora',sans-serif;background:var(--black);color:var(--white);animation:fadeIn .6s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

header{position:fixed;top:0;left:0;right:0;z-index:10;padding:1.8rem;text-align:center;pointer-events:none}

.universe{display:grid;grid-template-columns:repeat(3,1fr);height:100vh}

.brand{position:relative;overflow:hidden;cursor:pointer;text-decoration:none}
.brand img.bg{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.25,.46,.45,.94);filter:brightness(.45)}
.brand:hover img.bg{transform:scale(1.06);filter:brightness(.3)}
.brand-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;padding-top:200px}
.brand-logo{height:32px;width:auto;opacity:.85;margin-bottom:1.4rem}
.brand-label{font-size:.58rem;font-weight:600;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);margin-bottom:.8rem;opacity:.8}
.brand-name{font-family:'DM Serif Display',serif;font-size:clamp(1.8rem,3vw,2.8rem);line-height:1.05;color:var(--white);margin-bottom:1.5rem}
.brand-name em{color:var(--accent);font-style:italic}
.brand-btn{font-family:'Sora',sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--white);border:1px solid rgba(255,255,255,.3);padding:.65rem 1.8rem;transition:all .3s;opacity:0;transform:translateY(8px)}
.brand:hover .brand-btn{opacity:1;transform:translateY(0);border-color:var(--accent);color:var(--accent)}
.brand-coming{font-size:.58rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-top:1rem;opacity:0;transform:translateY(8px);transition:all .3s .05s}
.brand:hover .brand-coming{opacity:1;transform:translateY(0)}
.brand:not(:last-child)::after{content:'';position:absolute;top:10%;right:0;height:80%;width:1px;background:rgba(255,255,255,.08)}

footer{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:1.5rem;text-align:center}
.footer-copy{font-size:.58rem;color:rgba(255,255,255,.2);letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>

<header>
  <img src="assets/images/logo-korva-header.png" alt="KORVA" style="height:56px;width:auto;opacity:.9;display:block;margin:0 auto">
  <div style="font-family:'Sora',sans-serif;font-size:.62rem;font-weight:500;letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.45);text-align:center;margin-top:.5rem">Universo KORVA</div>
</header>

<div class="universe">

  <a href="index.html" class="brand">
    <img class="bg" src="assets/images/Lookbook1.webp" alt="KORVA Pádel" fetchpriority="high">
    <div class="brand-overlay">
      <img class="brand-logo" src="assets/images/logo-korva-header.png" alt="KORVA">
      <span class="brand-label">Alto rendimiento</span>
      <div class="brand-name">KORVA<br><em>Pádel</em></div>
      <div class="brand-btn">Entrar</div>
    </div>
  </a>

  <a href="pickleball.html" class="brand">
    <img class="bg" src="assets/images/univ-pickle.webp" alt="KORVA Pickleball" loading="lazy">
    <div class="brand-overlay">
      <img class="brand-logo" src="assets/images/logo-korva-header.png" alt="KORVA">
      <span class="brand-label">Alto rendimiento</span>
      <div class="brand-name">KORVA<br><em>Pickleball</em></div>
      <div class="brand-btn">Entrar</div>
      <div class="brand-coming">Próximamente</div>
    </div>
  </a>

  <a href="footballflag.html" class="brand">
    <img class="bg" src="assets/images/univ-flag.webp" alt="KORVA Football Flag" loading="lazy">
    <div class="brand-overlay">
      <img class="brand-logo" src="assets/images/logo-korva-header.png" alt="KORVA">
      <span class="brand-label">Alto rendimiento</span>
      <div class="brand-name">KORVA<br><em>Football Flag</em></div>
      <div class="brand-btn">Entrar</div>
      <div class="brand-coming">Próximamente</div>
    </div>
  </a>

</div>

<footer>
  <span class="footer-copy">© 2026 KORVA — Todos los derechos reservados</span>
</footer>

<script src="//code.tidio.co/b2fb5elsg7pw0xnun90evdskyrrqgfef.js" async></script>
</body>
</html>
